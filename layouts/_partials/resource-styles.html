<style>
  .resource-page { max-width: 1120px; margin: 0 auto; padding: 4rem 1.5rem 5rem; color: #1f2937; }

  .resource-detail { max-width: 900px; }
  .resource-back { display: inline-block; margin-bottom: 2rem; text-decoration: underline; text-underline-offset: .2em; }

  .dark .resource-filters { background: #111827; border-color: #6b7280; }
  .dark .resource-filter-field :is(select, input) { background-color: #1f2937; color: #f3f4f6; border-color: #6b7280; color-scheme: dark; }

  @media (max-width: 800px) {

  /* Paper details follow EdWorkingPapers typography; list styles stay independent. */

  .dark .resource-detail .publication-meta { color: #d1d5db; }

  .dark .resource-detail .resource-body a[href$=".pdf"] { color: #fff; }
  @media (max-width: 640px) {

  .resource-detail .brief-title-block { padding-bottom:1rem; }

  .resource-detail .resource-authors { color:#6b7280; font-family:Arial,sans-serif; }
